name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            Write-Error "Run gofmt on: $unformatted"
            exit 1
          }
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check GoReleaser configuration
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
