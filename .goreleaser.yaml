version: 2

project_name: arn
dist: dist

before:
  hooks:
    - go mod tidy
    - go fmt ./...
    - go vet ./...
    - go test ./...

builds:
  - id: arn
    main: .
    binary: "{{ .Os }}_{{ .Arch }}/arn"
    no_unique_dist_dir: true
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/steromano87/awesome-release-notes/cli/arn/cmd.version={{ .Version }}
    tags:
      - osusergo
      - netgo
    buildmode: pie

archives:
  - id: binaries
    ids:
      - arn
    strip_binary_directory: true
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - src: schemas/release-notes.schema.json
        dst: .
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

announce:
  skip: true

release:
  disable: true
