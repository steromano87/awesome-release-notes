version: 2

project_name: arn-gen
dist: dist

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: arn-gen
    main: .
    binary: arn-gen
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: binaries
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - .release-notes.yaml
      - src: internal/config/release-notes.schema.json
        dst: .
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  disable: true

release:
  draft: true
